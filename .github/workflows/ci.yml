name: CI
on:
  pull_request:
    paths-ignore: [ '**.md', 'labs/**', 'project/**', 'docs/**' ]
  workflow_dispatch:          # bisa dijalankan manual dari tab Actions

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
        with: { clean: false }

      - name: Build image (atau pakai image publik bila belum ada app/)
        id: build
        run: |
          if (Test-Path app/Dockerfile) {
            docker build -t app:ci ./app
            if ($LASTEXITCODE -ne 0) { throw 'Docker build gagal' }
            'image=app:ci' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            docker pull bkimminich/juice-shop
            if ($LASTEXITCODE -ne 0) { throw 'Docker pull gagal' }
            'image=bkimminich/juice-shop' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Smoke test (aplikasi benar-benar bisa jalan)
        run: |
          $container = docker run -d --rm -p 127.0.0.1::3000 "${{ steps.build.outputs.image }}"
          if ($LASTEXITCODE -ne 0) { throw 'Docker run gagal' }
          try {
            $binding = docker port $container 3000/tcp
            if ($LASTEXITCODE -ne 0) { throw 'Port container tidak ditemukan' }
            $port = ($binding -split ':')[-1]
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port" -TimeoutSec 3 -ErrorAction Stop | Out-Null
                $ok = $true
                break
              } catch { Start-Sleep -Seconds 3 }
            }
            if (-not $ok) { docker logs $container; throw 'App tidak merespons' }
            Write-Output 'App up'
          } finally {
            docker stop $container | Out-Null
          }
